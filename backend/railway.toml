[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[[services]]
name = "api"
source = "."

[services.deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
healthcheckPath = "/health"
healthcheckTimeout = 30

[[services]]
name = "worker"
source = "."

[services.deploy]
startCommand = "celery -A app.workers.celery_app worker --pool=solo --loglevel=info --concurrency=1"
